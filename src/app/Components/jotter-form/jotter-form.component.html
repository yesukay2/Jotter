<!DOCTYPE html>
<form [formGroup]="jotterForm" (ngSubmit)="createJotter()">
  <div class="back-btn" (click)="goBack()">Cancel</div>
  <input
    type="text"
    name="title"
    id="jotter-title"
    formControlName="title"
    alt="Jotter title"
  />
  <textarea
    name="content"
    id="jotter-content"
    formControlName="content"
    alt="Jotter content"
  ></textarea>
  <button type="submit">{{ isEditMode ? "Update Jot" : "Add Jot" }}</button>
</form>
