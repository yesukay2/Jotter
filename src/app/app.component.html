<div class="layout">
  <button
    class="hamburger"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="Toggle Sidebar"
    *ngIf="!menuOpen && !isLoginRoute()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div
    class="sidebar-overlay"
    [class.show]="menuOpen"
    (click)="menuOpen = false"
  ></div>

  <app-navbar
    *ngIf="!isLoginRoute()"
    [menuOpen]="menuOpen"
    (closeMenu)="menuOpen = false"
  ></app-navbar>
  <main class="main-content" [class.no-sidebar]="isLoginRoute()">
    <router-outlet />
  </main>
</div>
